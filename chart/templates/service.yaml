apiVersion: v1
kind: Service
metadata:
  name: {{ include "crococoder-status.fullname" . }}
  labels:
    {{- include "crococoder-status.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http          # named port: the ServiceMonitor refers to it by name
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "crococoder-status.selectorLabels" . | nindent 4 }}

{{- if .Values.networkPolicy.enabled }}
# Allows the traffic the app needs. The namespace-wide "deny all ingress" policy is created
# by Terraform (ref-infra), so this rule is what opens the door for Prometheus.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "crococoder-status.fullname" . }}-allow-ingress
  labels:
    {{- include "crococoder-status.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "crococoder-status.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Prometheus scrapes /metrics from the monitoring namespace.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }}
        {{- with .Values.networkPolicy.extraIngress }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - port: {{ .Values.containerPort }}
          protocol: TCP
{{- end }}
